version: "3.9"

services:
  ai-service:
    build: .
    ports:
      - "8001:8001"
    env_file:
      - .env
    volumes:
      - ./:/app
    depends_on:
      - redis
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8001", "--reload"]

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: ["redis-server", "--save", "", "--appendonly", "no"]

