apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: talentai-ingress
  namespace: talentai-prod
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  tls:
  - hosts:
    - api.talentai.io
    secretName: talentai-tls
  rules:
  - host: api.talentai.io
    http:
      paths:
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: node-api-service
            port:
              number: 80
